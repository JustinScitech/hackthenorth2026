services:
  - type: worker
    name: astra-risk-agent
    runtime: node
    buildCommand: npm ci
    preDeployCommand: npm run deploy:check && npm run db:migrate
    startCommand: npm run worker
    maxShutdownDelaySeconds: 120
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: underwriting_agent
      - key: TEMPORAL_ADDRESS
        sync: false
      - key: TEMPORAL_NAMESPACE
        sync: false
      - key: TEMPORAL_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
